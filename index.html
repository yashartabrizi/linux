<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربات هوشمند همدم</title>
    <style>
        :root {
            --primary-color: #4a6bff;
            --dark-color: #1a1a2e;
            --light-color: #f5f5f5;
            --user-msg-bg: #e3f2fd;
            --bot-msg-bg: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: #333;
            transition: all 0.3s ease;
        }

        body.dark-mode {
            background-color: var(--dark-color);
            color: #f5f5f5;
            --bot-msg-bg: #16213e;
            --user-msg-bg: #0f3460;
            --light-color: #1a1a2e;
        }

        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            background-color: white;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .dark-mode .chat-container {
            background-color: #16213e;
        }

        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--light-color);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-user {
            align-items: flex-end;
        }

        .message-bot {
            align-items: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            margin-top: 5px;
            position: relative;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message .message-content {
            background-color: var(--user-msg-bg);
            color: #333;
            border-bottom-right-radius: 0;
        }

        .dark-mode .user-message .message-content {
            color: #f5f5f5;
        }

        .bot-message .message-content {
            background-color: var(--bot-msg-bg);
            border-bottom-left-radius: 0;
            box-shadow: var(--shadow);
        }

        .message-time {
            font-size: 0.7rem;
            color: #777;
            margin-top: 3px;
        }

        .dark-mode .message-time {
            color: #aaa;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            background-color: white;
            border-top: 1px solid #eee;
        }

        .dark-mode .chat-input {
            background-color: #16213e;
            border-top: 1px solid #0f3460;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s;
        }

        .dark-mode #user-input {
            background-color: #0f3460;
            color: white;
            border: 1px solid #4a6bff;
        }

        #user-input:focus {
            border-color: var(--primary-color);
        }

        #send-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            margin-right: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        #send-button:hover {
            background-color: #3a5af0;
            transform: scale(1.05);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .typing-indicator {
            display: none;
            padding: 10px 15px;
            background-color: var(--bot-msg-bg);
            border-radius: 18px;
            border-bottom-left-radius: 0;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            width: fit-content;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #777;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @media (max-width: 600px) {
            .chat-container {
                margin: 0;
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>ربات هوشمند همدم</h2>
            <button class="theme-toggle" id="theme-toggle">🌓</button>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <div class="message-content">
                    سلام! من ربات هوشمند شما هستم. چگونه می‌توانم به شما کمک کنم؟
                </div>
                <div class="message-time" id="welcome-time"></div>
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="chat-input">
            <input type="text" id="user-input" placeholder="پیام خود را بنویسید..." autofocus>
            <button id="send-button">➤</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const typingIndicator = document.getElementById('typing-indicator');
            const themeToggle = document.getElementById('theme-toggle');

            document.getElementById('welcome-time').textContent = getCurrentTime();

            themeToggle.addEventListener('click', toggleTheme);

            if (localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
            }

            sendButton.addEventListener('click', sendMessage);

            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            async function sendMessage() { // Added async here as per original instruction for context, not part of this subtask's direct change.
                const message = userInput.value.trim();
                if (message === '') return;

                addMessage(message, 'user');
                userInput.value = '';

                typingIndicator.style.display = 'block';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Call generateResponse and wait for the result
                const botResponse = await generateResponse(message);

                // Add the bot's message to the chat
                addMessage(botResponse, 'bot');

                // Hide typing indicator AFTER message is added
                typingIndicator.style.display = 'none';
                chatMessages.scrollTop = chatMessages.scrollHeight; // Scroll again after bot message
            }

            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}-message`;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = text;

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = getCurrentTime();

                messageDiv.appendChild(contentDiv);
                messageDiv.appendChild(timeDiv);

                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function getCurrentTime() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                return `${hours}:${minutes}`;
            }

            async function generateResponse(userMessage) { // This function IS THE TARGET of this subtask
                return await fetchLLMResponse(userMessage);
            }

            async function fetchLLMResponse(userMessage) {
                const llmApiUrl = 'YOUR_LLM_ENDPOINT_URL'; // Placeholder for the LLM API endpoint
                const apiKey = 'YOUR_API_KEY'; // IMPORTANT: Replace with your actual API key AND handle it securely (e.g., via a backend proxy) for production.

                // Note: The structure of the request (headers, body) is highly dependent on the specific LLM provider.
                // The following is a generic example and might need significant adjustment.

                try {
                    const response = await fetch(llmApiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            // Most APIs require an Authorization header.
                            // Example: 'Authorization': `Bearer ${apiKey}`
                            // Some might require the key in a different header like 'X-API-Key': apiKey
                            // Ensure you use the correct scheme for your chosen LLM provider.
                            // Storing API keys directly in client-side code is insecure for production.
                            // Consider this line commented out unless you understand the security risks for your specific (development/testing) use case.
                            // 'Authorization': `Bearer ${apiKey}`,
                        },
                        body: JSON.stringify({
                            // The request body structure varies greatly between LLM providers.
                            // This is a common pattern, but you MUST consult your LLM's API documentation.
                            prompt: userMessage, // For some models like older OpenAI text completion
                            // messages: [{ role: "user", content: userMessage }], // For chat completion models (OpenAI, Gemini, etc.)
                            max_tokens: 150, // Example parameter to limit response length
                            // model: "text-davinci-003" // Example model name, if required by the API
                        })
                    });

                    if (!response.ok) {
                        // Handle HTTP errors (e.g., 4xx, 5xx status codes)
                        console.error(`API request failed with status: ${response.status} ${response.statusText}`);
                        // You might want to parse response.json() here if the API sends error details in the body
                        // const errorData = await response.json();
                        // console.error('Error details:', errorData);
                        return "متاسفانه در پردازش درخواست شما خطایی رخ داد. (کد خطا: " + response.status + ")";
                    }

                    const responseData = await response.json();

                    // Extracting the actual text response also varies. Consult your LLM's API documentation.
                    // Example for some OpenAI models:
                    // const botText = responseData.choices[0].message.content.trim();
                    // Example for some older OpenAI models:
                    // const botText = responseData.choices[0].text.trim();
                    // Example for Google Gemini:
                    // const botText = responseData.candidates[0].content.parts[0].text.trim();

                    // Using a generic placeholder for extraction - REPLACE THIS with actual logic for your LLM
                    const botText = responseData.reply || (responseData.choices && responseData.choices[0].text) || (responseData.choices && responseData.choices[0].message && responseData.choices[0].message.content) || (responseData.candidates && responseData.candidates[0].content.parts[0].text) || "پاسخی از سرویس دریافت نشد.";

                    return botText.trim();

                } catch (error) {
                    console.error('خطا در ارتباط با سرویس LLM:', error);
                    return "متاسفانه مشکلی در ارتباط با سرویس پیش آمده است. لطفاً بعداً تلاش کنید.";
                }
            }

            function toggleTheme() {
                document.body.classList.toggle('dark-mode');
                const isDarkMode = document.body.classList.contains('dark-mode');
                localStorage.setItem('darkMode', isDarkMode ? 'enabled' : 'disabled');
            }
        });
    </script>
</body>
</html>
